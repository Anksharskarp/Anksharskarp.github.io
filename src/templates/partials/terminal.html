<details class="command-console" id="terminal">
  <summary>
    <span
      ><span class="prompt-mark" aria-hidden="true">&gt;_</span> Terminal</span
    ><span class="console-hint">Navigation shortcuts</span>
  </summary>
  <div class="console-body">
    <p id="command-help">
      Try <code>/work</code>, <code>/experience</code>, <code>/about</code>,
      <code>/blog</code>, <code>/contact</code>, or <code>/resume</code>.
    </p>
    <form id="command-form">
      <label for="command-input">william@portfolio ~ $</label
      ><input
        id="command-input"
        name="command"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        placeholder="/help"
        aria-describedby="command-help"
      /><button type="submit">Run <span aria-hidden="true">↵</span></button>
    </form>
    <p id="command-feedback" role="status" aria-live="polite">
      Ready. Use /help to see all commands.
    </p>
    <noscript
      ><p>
        Commands need JavaScript. All pages and sections are available in the
        navigation above.
      </p></noscript
    >
  </div>
</details>
