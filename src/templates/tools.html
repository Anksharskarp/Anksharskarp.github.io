<header class="tools-header">
  <p class="eyebrow">
    <span class="prompt-mark" aria-hidden="true">~/</span> Tools / 01
  </p>
  <h1>
    Differential equations<span class="name-period" aria-hidden="true">_</span>
  </h1>
  <p>Direction fields, phase planes, and numerical solutions.</p>
</header>
<section
  class="ode-tool"
  data-ode-tool
  aria-label="Differential equations workspace"
>
  <div class="ode-toolbar">
    <div class="ode-modes" role="group" aria-label="Equation type">
      <button
        type="button"
        data-mode="direction"
        data-window-fallback
        aria-pressed="true"
        disabled
      >
        Direction field <span>dy/dt</span>
      </button>
      <button type="button" data-mode="phase" aria-pressed="false" disabled>
        Phase plane <span>dx/dt, dy/dt</span>
      </button>
    </div>
    <div class="ode-window-actions" role="group" aria-label="Settings windows">
      <button
        type="button"
        data-open-window="ode-parameters-window"
        aria-haspopup="dialog"
        disabled
      >
        Parameters
      </button>
      <button
        type="button"
        data-open-window="ode-bounds-window"
        aria-haspopup="dialog"
        disabled
      >
        Plot window
      </button>
      <button
        type="button"
        data-open-window="ode-integration-window"
        aria-haspopup="dialog"
        disabled
      >
        Integration
      </button>
    </div>
    <div
      class="ode-window-actions ode-result-actions"
      role="group"
      aria-label="Results windows"
    >
      <button
        type="button"
        data-open-window="ode-solution-window"
        aria-haspopup="dialog"
        disabled
      >
        Solution values
      </button>
      <button
        type="button"
        data-find
        data-phase-only
        aria-haspopup="dialog"
        hidden
        disabled
      >
        Find equilibria
      </button>
    </div>
  </div>
  <p class="ode-startup" data-startup role="status">
    The calculator needs JavaScript. If it does not open, reload this page. The
    equation and method notes are available below.
  </p>
  <div class="ode-layout">{{equations}} {{plot}}</div>
  {{windows}}
</section>
{{notes}}
